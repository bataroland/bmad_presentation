# Server
server.port=8081
server.servlet.context-path=/library

# H2 Database
spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Data initialization (Boot 2.5+ changed execution order — data.sql now runs BEFORE DDL by default)
spring.jpa.defer-datasource-initialization=true

# Jackson date format
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Europe/Budapest

# Springfox compatibility workaround (TEMPORARY — remove in Phase 2 with SpringDoc migration)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
